<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>Bitácoras OP-F-12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Concepto: registro documental. Elegir proyecto y semana, volcar las hojas, ver si el conteo cuadra y generar el PDF. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef1; --ink:#1f2933; --ink-2:#5b6672;
  --line:#d8dce1; --accent:#c8102e; --accent-ink:#ffffff; --ok:#1d7a4b; --ok-bg:#e1f2e8;
  --warn:#9a5b00; --warn-bg:#fdf0d8; --shadow:0 1px 2px rgba(31,41,51,.08);
  --font-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181d; --surface:#1d232a; --surface-2:#262d35; --ink:#e8ebee; --ink-2:#9aa5b1;
    --line:#333b45; --accent:#ff4d62; --accent-ink:#14181d; --ok:#5ed08e; --ok-bg:#1b3327;
    --warn:#f0b45a; --warn-bg:#3a2e17; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1d232a; --surface-2:#262d35; --ink:#e8ebee; --ink-2:#9aa5b1;
  --line:#333b45; --accent:#ff4d62; --accent-ink:#14181d; --ok:#5ed08e; --ok-bg:#1b3327;
  --warn:#f0b45a; --warn-bg:#3a2e17; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.4 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:1.6rem;line-height:1.1}
.eyebrow{font:600 .72rem var(--font-display);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;
  min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.controls{padding:14px;display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.grow>*{flex:1;min-width:0}
select,input[type=text],input[type=number]{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;
}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.weeknav .label{text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.15rem;line-height:1.15}
.weeknav .label small{display:block;font:500 .78rem var(--font-body);color:var(--ink-2)}
.overview{padding:6px 14px}
.overview h2{font-size:1rem;padding-top:8px}
.ov-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);
  padding:12px 0;text-align:left;min-height:48px;
}
.ov-row:first-of-type{border-top:0}
.ov-row .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.ov-row.current .nm{font-weight:600}
.ov-row.current .nm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
.pill{font:600 .78rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.missing{background:var(--warn-bg);color:var(--warn)}
.pill.extra{background:var(--surface-2);color:var(--ink)}
.upload{padding:14px;display:grid;gap:12px}
.count{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count .big{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1}
.count .big small{font-size:1rem;font-weight:500;color:var(--ink-2)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:99px}
.progress.done>div{background:var(--ok)}
.hint{font-size:.85rem;color:var(--ink-2)}
.stepper{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stepper label{font-weight:600;font-size:.9rem}
.stepper .ctl{display:grid;grid-template-columns:44px 72px 44px;gap:6px}
.stepper input{text-align:center;padding:8px 4px}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:0;margin:0;list-style:none}
.thumb{
  position:relative;width:100%;aspect-ratio:4/3;border-radius:6px;border:1px solid var(--line);
  background:var(--surface-2) center/cover no-repeat;padding:0;
}
.thumb .n{
  position:absolute;left:4px;top:4px;background:var(--ink);color:var(--bg);border-radius:4px;
  font:600 .72rem var(--font-display);padding:1px 6px;
}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.bar-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar-inner .info{flex:1;min-width:0;font-size:.85rem;color:var(--ink-2);line-height:1.25}
.bar-inner .info strong{display:block;color:var(--ink);font-size:.95rem}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:14px;
}
.viewer img{width:100%;max-height:58vh;object-fit:contain;background:var(--surface-2);border-radius:8px}
.qs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90vw;font-size:.92rem;
}
[hidden]{display:none!important}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:14px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .12s}.progress>div{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">SBM · OP-F-12</div>
      <h1>Bitácoras de limpieza</h1>
    </div>
    <button class="btn small" data-action="manage">Editar proyecto</button>
  </header>

  <section class="panel controls" aria-label="Proyecto y semana">
    <div class="field">
      <label for="project-select">Proyecto</label>
      <select id="project-select"></select>
    </div>
    <div class="weeknav">
      <button class="btn" data-action="week-prev" aria-label="Semana anterior">‹</button>
      <div class="label" id="week-label"></div>
      <button class="btn" data-action="week-next" aria-label="Semana siguiente">›</button>
    </div>
  </section>

  <section class="panel upload" aria-label="Hojas de la semana">
    <div class="count">
      <div class="big" id="count-big"></div>
      <span class="pill" id="count-pill"></span>
    </div>
    <div class="progress" id="progress"><div></div></div>
    <div class="stepper">
      <label for="exp-input">Hojas esperadas esta semana</label>
      <div class="ctl">
        <button class="btn" data-action="exp-minus" aria-label="Una hoja menos">−</button>
        <input type="number" id="exp-input" min="1" max="500" inputmode="numeric">
        <button class="btn" data-action="exp-plus" aria-label="Una hoja más">+</button>
      </div>
    </div>
    <div class="row grow">
      <button class="btn primary" data-action="files">Subir fotos</button>
      <button class="btn" data-action="camera">Tomar foto</button>
    </div>
    <p class="hint" id="upload-hint" style="margin:0">Puedes elegir todas las hojas de una vez.</p>
    <ul class="grid" id="grid"></ul>
  </section>

  <section class="panel overview" id="overview" hidden></section>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="info" id="bar-info"></div>
    <button class="btn" id="btn-share" data-action="share" hidden>Compartir</button>
    <button class="btn primary" id="btn-pdf" data-action="pdf">Generar PDF</button>
  </div>
</div>

<input type="file" id="in-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="in-files" accept="image/*" multiple hidden>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Almacenamiento (IndexedDB) ---------- */
const DB_NAME='bitacoras-sbm', DB_VER=1;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,DB_VER);
    rq.onupgradeneeded=()=>{
      const d=rq.result;
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode); const s=t.objectStore(store);
    const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));

/* ---------- Estado ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const state={projects:[],photos:[],projectId:null,week:null};
const urls=new Map();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_PROJECT={id:'advant-medical',name:'ADVANT MEDICAL',expected:5};

/* ---------- Semanas (lunes a domingo) ---------- */
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const fmtShort=d=>d.getDate()+' '+MESES[d.getMonth()];
function defaultWeek(){ return keyOf(addDays(mondayOf(new Date()),-7)); } // la semana que acaba de cerrar

/* ---------- Helpers de datos ---------- */
const project=()=>state.projects.find(p=>p.id===state.projectId);
const photosOf=(pid,week)=>state.photos.filter(f=>f.projectId===pid&&f.week===week).sort((a,b)=>a.order-b.order);
const weekPhotos=()=>photosOf(state.projectId,state.week);
function thumbUrl(f){
  if(!urls.has(f.id)) urls.set(f.id,URL.createObjectURL(f.blob));
  return urls.get(f.id);
}
function dropUrl(id){ if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)} }
function toast(msg,ms){
  const t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true},ms||2600);
}
function expectedFor(p,week){const t=p.targets&&p.targets[week];return typeof t==='number'?t:p.expected}
async function setExpected(v){
  const p=project(); v=Math.max(1,Math.min(500,parseInt(v,10)||1));
  p.targets=p.targets||{}; p.targets[state.week]=v; p.expected=v; // la semana siguiente parte de este número
  await dbPut('projects',p); render();
}
function status(n,exp){
  if(n===0) return {cls:'missing',txt:'Faltan '+exp};
  if(n<exp) return {cls:'missing',txt:'Faltan '+(exp-n)};
  if(n===exp) return {cls:'ok',txt:'Completo'};
  return {cls:'extra',txt:'Sobran '+(n-exp)};
}

/* ---------- Procesar foto ---------- */
async function loadBitmap(file){
  if(window.createImageBitmap){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  }
  return await new Promise((res,rej)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(u);res(img)}; img.onerror=rej; img.src=u;
  });
}
function toBlob(canvas){return new Promise(r=>canvas.toBlob(r,'image/jpeg',0.86))}
async function processFile(file){
  const bmp=await loadBitmap(file);
  const w=bmp.width,h=bmp.height,max=2200,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close) bmp.close();
  return {blob:await toBlob(c),w:c.width,h:c.height};
}
async function rotateBlob(blob){
  const bmp=await loadBitmap(blob);
  const c=document.createElement('canvas'); c.width=bmp.height; c.height=bmp.width;
  const g=c.getContext('2d'); g.translate(c.width/2,c.height/2); g.rotate(Math.PI/2); g.drawImage(bmp,-bmp.width/2,-bmp.height/2);
  if(bmp.close) bmp.close();
  return {blob:await toBlob(c),w:c.width,h:c.height};
}
async function addFiles(files){
  const list=Array.from(files||[]).filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if(!list.length) return;
  const pid=state.projectId, week=state.week;
  let n=0, base=Date.now();
  for(const file of list){
    try{
      toast('Procesando foto '+(n+1)+' de '+list.length+'…',8000);
      const p=await processFile(file);
      const rec={id:uid(),projectId:pid,week:week,order:base+n,blob:p.blob,w:p.w,h:p.h};
      await dbPut('photos',rec); state.photos.push(rec); n++;
      if(pid===state.projectId&&week===state.week) render();
    }catch(e){ toast('No se pudo leer "'+file.name+'". Prueba con otra foto.',4000); }
  }
  render();
  if(n) toast(n===1?'Foto guardada':n+' fotos guardadas');
}

/* ---------- Render ---------- */
function render(){
  const p=project(); const photos=weekPhotos(); const n=photos.length; const exp=expectedFor(p,state.week);
  // controles
  const sel=$('#project-select');
  sel.innerHTML=state.projects.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');
  sel.value=state.projectId;
  const mon=fromKey(state.week), sun=addDays(mon,6);
  $('#week-label').innerHTML='Semana del '+fmtShort(mon)+' al '+fmtShort(sun)+'<small>'+fmt(mon)+' – '+fmt(sun)+'</small>';
  // conteo
  const st=status(n,exp);
  $('#count-big').innerHTML=n+' <small>de '+exp+' hojas</small>';
  const ei=$('#exp-input'); if(document.activeElement!==ei) ei.value=exp;
  const pill=$('#count-pill'); pill.className='pill '+st.cls; pill.textContent=st.txt;
  const pr=$('#progress'); pr.className='progress'+(n>=exp?' done':'');
  pr.firstElementChild.style.width=Math.min(100,exp?n/exp*100:0)+'%';
  $('#upload-hint').textContent=n===0?'Puedes elegir todas las hojas de una vez.':(n>exp?'Hay más hojas de las esperadas. Revisa que no haya repetidas.':'Toca una hoja para verla, girarla, moverla o eliminarla.');
  $('#grid').innerHTML=photos.map((f,i)=>'<li><button class="thumb" data-action="view" data-id="'+f.id+'" style="background-image:url('+thumbUrl(f)+')" aria-label="Ver hoja '+(i+1)+'"><span class="n">'+(i+1)+'</span></button></li>').join('');
  // resumen de proyectos
  const ov=$('#overview'); ov.hidden=false;
  ov.innerHTML='<div class="ov-head"><h2>Todos los proyectos esta semana</h2><button class="btn small" data-action="m-new">＋ Proyecto</button></div>'+state.projects.map(x=>{
    const e=expectedFor(x,state.week), c=photosOf(x.id,state.week).length, s=status(c,e);
    return '<button class="ov-row'+(x.id===state.projectId?' current':'')+'" data-action="goto" data-id="'+esc(x.id)+'"><span class="nm">'+esc(x.name)+'</span><span class="pill '+s.cls+'">'+c+' / '+e+'</span></button>';
  }).join('');
  // barra
  $('#bar-info').innerHTML='<strong>'+n+(n===1?' página':' páginas')+' en el PDF</strong>'+(n<exp?'Faltan '+(exp-n)+' hojas':(n===exp?'Semana completa':'Sobran '+(n-exp)+' hojas'));
  $('#btn-pdf').disabled=n===0;
  $('#btn-share').hidden=!(navigator.canShare&&navigator.share);
  $('#btn-share').disabled=n===0;
}

/* ---------- PDF ---------- */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function pdfName(){
  const mon=fromKey(state.week), sun=addDays(mon,6);
  return 'OP-F-12 Bitácoras de limpieza - '+project().name+' - '+fmtShort(mon)+' al '+fmtShort(sun)+' '+sun.getFullYear()+'.pdf';
}
async function buildPDF(){
  if(!window.jspdf){toast('No cargó la librería de PDF. Revisa la conexión e intenta de nuevo.',4500);return null}
  const ordered=weekPhotos();
  if(!ordered.length) return null;
  const {jsPDF}=window.jspdf; let doc=null; const M=6;
  for(let i=0;i<ordered.length;i++){
    toast('Armando el PDF… página '+(i+1)+' de '+ordered.length,20000);
    const f=ordered[i]; const land=f.w>=f.h;
    const pw=land?297:210, ph=land?210:297;
    if(!doc) doc=new jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a4',compress:true});
    else doc.addPage('a4',land?'landscape':'portrait');
    const k=Math.min((pw-2*M)/f.w,(ph-2*M)/f.h), w=f.w*k, h=f.h*k;
    doc.addImage(await blobToDataURL(f.blob),'JPEG',(pw-w)/2,(ph-h)/2,w,h,undefined,'FAST');
  }
  return doc;
}
async function makePDF(share){
  const btn=$('#btn-pdf'); btn.disabled=true; toast('Armando el PDF…',20000);
  try{
    const doc=await buildPDF(); if(!doc){return}
    const name=pdfName();
    if(share){
      const file=new File([doc.output('blob')],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}); toast('Listo'); return}
      toast('Este dispositivo no permite compartir el archivo. Se descargará.');
    }
    doc.save(name); toast('PDF descargado');
  }catch(e){ if(e&&e.name==='AbortError'){toast('Cancelado')} else {toast('No se pudo generar el PDF. Intenta con menos fotos.',4500)} }
  finally{ btn.disabled=weekPhotos().length===0; }
}

/* ---------- Visor ---------- */
function openViewer(id){
  const list=weekPhotos(); const i=list.findIndex(x=>x.id===id); if(i<0) return;
  const f=list[i];
  $('#modal').innerHTML='<div class="overlay" data-action="close-modal"><div class="sheet viewer" role="dialog" aria-label="Hoja de bitácora">'+
    '<div class="qs-head"><h2 style="font-size:1.1rem">Hoja '+(i+1)+' de '+list.length+'</h2></div>'+
    '<img src="'+thumbUrl(f)+'" alt="Hoja '+(i+1)+'">'+
    '<div class="row grow"><button class="btn" data-action="move-prev" data-id="'+f.id+'"'+(i===0?' disabled':'')+'>← Antes</button>'+
    '<button class="btn" data-action="move-next" data-id="'+f.id+'"'+(i===list.length-1?' disabled':'')+'>Después →</button>'+
    '<button class="btn" data-action="rotate" data-id="'+f.id+'">Girar</button></div>'+
    '<div class="row grow"><button class="btn danger" data-action="delete-photo" data-id="'+f.id+'">Eliminar</button>'+
    '<button class="btn primary" data-action="close-modal-btn">Listo</button></div></div></div>';
}
function closeModal(){$('#modal').innerHTML=''}
async function move(id,dir){
  const list=weekPhotos(); const i=list.findIndex(x=>x.id===id); const j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i], b=list[j]; const t=a.order; a.order=b.order; b.order=t;
  await dbPut('photos',a); await dbPut('photos',b); render(); openViewer(id);
}

/* ---------- Proyectos ---------- */
let draft=null;
function openManage(){ draft=JSON.parse(JSON.stringify(project())); drawManage(); }
function drawManage(){
  $('#modal').innerHTML='<div class="overlay" data-action="close-modal"><div class="sheet" role="dialog" aria-label="Proyectos">'+
    '<h2>Proyecto</h2>'+
    '<div class="field"><label for="m-name">Nombre</label><input type="text" id="m-name" value="'+esc(draft.name)+'"></div>'+
    '<p class="hint" style="margin:0">El número de hojas se ajusta cada semana en la pantalla principal, con − y +.</p>'+
    '<div class="row grow"><button class="btn primary" data-action="m-save">Guardar</button><button class="btn" data-action="close-modal-btn">Cancelar</button></div>'+
    '<div class="row grow"><button class="btn" data-action="m-new">Nuevo proyecto</button><button class="btn danger" data-action="m-delete">Eliminar proyecto</button></div>'+
    '<p class="hint" style="margin:0">Al eliminar un proyecto se borran todas sus fotos de este dispositivo.</p>'+
    '</div></div>';
}
function syncDraft(){
  const n=$('#m-name'), e=$('#m-exp');
  if(n) draft.name=n.value;
  if(e) draft.expected=Math.max(1,Math.min(500,parseInt(e.value,10)||1));
}

/* ---------- Eventos ---------- */
let confirmKey=null,confirmT=null;
function needConfirm(btn,key,label){
  if(confirmKey===key){confirmKey=null;clearTimeout(confirmT);return true}
  confirmKey=key; const old=btn.textContent; btn.textContent=label||'¿Seguro? Toca otra vez';
  clearTimeout(confirmT); confirmT=setTimeout(()=>{confirmKey=null;if(btn.isConnected)btn.textContent=old},3500);
  return false;
}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-action]'); if(!el) return;
  const act=el.dataset.action;
  if(act==='close-modal'){ if(ev.target===el) closeModal(); return; }
  switch(act){
    case 'close-modal-btn': closeModal(); break;
    case 'week-prev': state.week=keyOf(addDays(fromKey(state.week),-7)); saveSel(); render(); break;
    case 'week-next': state.week=keyOf(addDays(fromKey(state.week),7)); saveSel(); render(); break;
    case 'goto': state.projectId=el.dataset.id; saveSel(); render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'camera': $('#in-camera').click(); break;
    case 'files': $('#in-files').click(); break;
    case 'view': openViewer(el.dataset.id); break;
    case 'move-prev': move(el.dataset.id,-1); break;
    case 'move-next': move(el.dataset.id,1); break;
    case 'rotate': {
      const f=state.photos.find(x=>x.id===el.dataset.id); if(!f) break;
      el.disabled=true;
      try{const r=await rotateBlob(f.blob); f.blob=r.blob;f.w=r.w;f.h=r.h; dropUrl(f.id); await dbPut('photos',f); render(); openViewer(f.id);}
      catch(e){toast('No se pudo girar la foto')}
      break;
    }
    case 'delete-photo': {
      if(!needConfirm(el,'del-'+el.dataset.id,'¿Eliminar? Toca otra vez')) break;
      const id=el.dataset.id; await dbDel('photos',id); dropUrl(id);
      state.photos=state.photos.filter(x=>x.id!==id); closeModal(); render(); toast('Foto eliminada'); break;
    }
    case 'exp-minus': setExpected(expectedFor(project(),state.week)-1); break;
    case 'exp-plus': setExpected(expectedFor(project(),state.week)+1); break;
    case 'pdf': makePDF(false); break;
    case 'share': makePDF(true); break;
    case 'manage': openManage(); break;
    case 'm-save': {
      syncDraft();
      draft.name=draft.name.trim()||'Proyecto sin nombre';
      await dbPut('projects',draft);
      const i=state.projects.findIndex(p=>p.id===draft.id); state.projects[i]=draft;
      closeModal(); render(); toast('Proyecto guardado'); break;
    }
    case 'm-new': {
      const np={id:'p'+uid(),name:'Nuevo proyecto',expected:10};
      await dbPut('projects',np); state.projects.push(np); state.projectId=np.id; saveSel();
      draft=JSON.parse(JSON.stringify(np)); render(); drawManage();
      const nm=$('#m-name'); if(nm){nm.focus();nm.select()} break;
    }
    case 'm-delete': {
      if(state.projects.length<2){toast('Debe quedar al menos un proyecto');break}
      if(!needConfirm(el,'delproj','¿Eliminar todo? Toca otra vez')) break;
      const id=state.projectId;
      for(const f of state.photos.filter(x=>x.projectId===id)){await dbDel('photos',f.id);dropUrl(f.id)}
      state.photos=state.photos.filter(x=>x.projectId!==id);
      await dbDel('projects',id); state.projects=state.projects.filter(p=>p.id!==id);
      state.projectId=state.projects[0].id; saveSel(); closeModal(); render(); toast('Proyecto eliminado'); break;
    }
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='project-select'){state.projectId=ev.target.value;saveSel();render()}
  if(ev.target.id==='exp-input'){setExpected(ev.target.value)}
});
$('#in-camera').addEventListener('change',e=>{const f=e.target.files;addFiles(f);e.target.value=''});
$('#in-files').addEventListener('change',e=>{const f=e.target.files;addFiles(f);e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function saveSel(){try{localStorage.setItem('bitacoras-sel',JSON.stringify({p:state.projectId,w:state.week}))}catch(e){}}
function loadSel(){try{return JSON.parse(localStorage.getItem('bitacoras-sel')||'null')}catch(e){return null}}

/* ---------- Inicio ---------- */
(async function init(){
  try{
    db=await openDB();
    state.projects=await dbAll('projects');
    if(!state.projects.length){await dbPut('projects',DEFAULT_PROJECT);state.projects=[DEFAULT_PROJECT]}
    // proyectos de la versión anterior (con áreas) pasan a un número de hojas esperadas
    for(const p of state.projects){
      if(!p.expected){p.expected=(p.areas&&p.areas.length)||10; delete p.areas; await dbPut('projects',p)}
    }
    state.photos=await dbAll('photos');
  }catch(e){
    state.projects=[DEFAULT_PROJECT];
    toast('Este navegador no permite guardar fotos. Usa Chrome o Safari fuera de modo privado.',6000);
    db={transaction:()=>{throw new Error('sin-db')}};
  }
  const sel=loadSel();
  state.projectId=(sel&&state.projects.some(p=>p.id===sel.p))?sel.p:state.projects[0].id;
  state.week=(sel&&sel.w)||defaultWeek();
  render();
})();
})();
</script>
</body>
</html>
